<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RentRight — Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="position: relative; overflow: hidden; height: 100vh;">

  <!-- Decorative Animated Glowing Blobs in Background -->
  <div class="glow-blob blue" style="opacity: 0.15; filter: blur(90px);"></div>
  <div class="glow-blob cyan" style="opacity: 0.15; filter: blur(90px);"></div>

  <!-- Background Image with Overlay -->
  <main class="hero" role="main">
    <div class="bg-overlay" aria-hidden="true"></div>

    <!-- Login Header -->
    <header class="site-header" style="position: absolute; background: transparent; border: 0; backdrop-filter: none;">
      <div class="header-container" style="max-width: 100%;">
        <a class="brand" href="index.html" aria-label="RentRight home" style="color: var(--brand);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 11.5L12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11.5z" fill="var(--brand)"/>
          </svg>
          <span>Rent<span class="brand-text">Right</span></span>
        </a>
        <a href="#" aria-label="Help" style="color: var(--navy); display: flex; align-items: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </a>
      </div>
    </header>

    <!-- Glassmorphic Login Card -->
    <section class="card" aria-labelledby="login-title">
      <div class="card-top">
        <div class="logo">
          <!-- House SVG with Tenant Outline -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10.5z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="2" stroke="white" stroke-width="2"/>
            <path d="M9 18c0-1.5 1.5-2.5 3-2.5s3 1 3 2.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 id="login-title" class="title">RentRight</h1>
        <p class="subtitle">Your Trusted Tenant Rights Assistant</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="label">Email Address</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="e.g. jdoe@example.com" class="no-icon" required aria-required="true">
        </div>

        <div class="form-group">
          <div class="forgot-row">
            <label for="password" class="label" style="margin: 0;">Password</label>
            <a class="forgot" href="#">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required aria-required="true">
            <button id="togglePwd" type="button" class="toggle-pwd" aria-label="Show password" title="Show password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="form-error" role="alert" aria-live="assertive" style="color:var(--danger);display:none;font-size:13px;font-weight:500;"></div>

        <label class="checkbox">
          <input type="checkbox" name="remember" />
          <span>Remember this device</span>
        </label>

        <button id="loginBtn" class="btn primary" type="submit">Login</button>

        <p class="signup-footer">Don't have an account? <a id="signupLink" href="signup.html">Sign up</a></p>
      </form>
    </section>
  </main>

  <!-- Simple Footer -->
  <footer class="page-footer-simple" role="contentinfo">
    <div class="footer-simple-container">
      <div>&copy; 2024 RentRight Tenant Advocacy. All rights reserved.</div>
      <div class="footer-simple-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Tenant Resources</a>
        <a href="#">Contact Support</a>
      </div>
    </div>
  </footer>

  <script src="main.js" defer></script>
</body>
</html>
