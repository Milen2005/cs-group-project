<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RentRight — Create Account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="position: relative; overflow: hidden; height: 100vh;">

  <!-- Decorative Animated Glowing Blobs in Background -->
  <div class="glow-blob blue" style="opacity: 0.15; filter: blur(90px);"></div>
  <div class="glow-blob cyan" style="opacity: 0.15; filter: blur(90px);"></div>

  <!-- Background Image with Overlay -->
  <main class="hero" role="main">
    <div class="bg-overlay" aria-hidden="true"></div>

    <!-- Signup Header -->
    <header class="site-header" style="position: absolute; background: transparent; border: 0; backdrop-filter: none;">
      <div class="header-container" style="max-width: 100%;">
        <a class="brand" href="index.html" aria-label="RentRight home" style="color: var(--brand);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 11.5L12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11.5z" fill="var(--brand)"/>
          </svg>
          <span>Rent<span class="brand-text">Right</span></span>
        </a>
        <a href="#" aria-label="Help" style="color: var(--navy); display: flex; align-items: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </a>
      </div>
    </header>

    <!-- Glassmorphic Signup Card -->
    <section class="card" aria-labelledby="signup-title">
      <div class="card-top">
        <div class="logo">
          <!-- House SVG with Tenant Outline -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10.5z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="2" stroke="white" stroke-width="2"/>
            <path d="M9 18c0-1.5 1.5-2.5 3-2.5s3 1 3 2.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 id="signup-title" class="title">RentRight</h1>
        <p class="subtitle">Create your account to protect your rights</p>
      </div>

      <form id="signupForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="fullname" class="label">Full Name</label>
          <input id="fullname" name="fullname" type="text" placeholder="Enter your full name" class="no-icon" required>
        </div>

        <div class="form-group">
          <label for="email" class="label">Email Address</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" class="no-icon" required>
        </div>

        <div class="form-group">
          <label for="password" class="label">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a password" class="no-icon" required>
        </div>

        <div class="form-group">
          <label for="confirm" class="label">Confirm Password</label>
          <input id="confirm" name="confirm" type="password" placeholder="Confirm your password" class="no-icon" required>
        </div>

        <div id="signupError" class="form-error" role="alert" aria-live="assertive" style="color:var(--danger);display:none;font-size:13px;font-weight:500;"></div>

        <button id="createBtn" class="btn primary" type="submit">Create account →</button>

        <div style="display:flex;align-items:center;gap:12px;margin:2px 0">
          <hr style="flex:1;border:none;border-top:1px solid rgba(16,24,40,0.08)">
          <div style="color:var(--muted);font-size:12px;font-weight:500;">OR</div>
          <hr style="flex:1;border:none;border-top:1px solid rgba(16,24,40,0.08)">
        </div>

        <p class="signup-footer" style="margin-top: 0;">Already have an account? <a href="login.html">Login</a></p>

        <!-- Secure text lock -->
        <div style="margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(30,109,249,0.04);display:flex;gap:10px;align-items:center;font-size:12px;color:#1044A5;font-weight:500;border:1px solid rgba(30,109,249,0.08)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <div>Your data is secured with AES-256 encryption.</div>
        </div>
      </form>
    </section>
  </main>

  <!-- Simple Footer -->
  <footer class="page-footer-simple" role="contentinfo">
    <div class="footer-simple-container">
      <div>&copy; 2024 RentRight Tenant Advocacy. All rights reserved.</div>
      <div class="footer-simple-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Tenant Resources</a>
        <a href="#">Contact Support</a>
      </div>
    </div>
  </footer>

  <script src="main.js" defer></script>
</body>
</html>
